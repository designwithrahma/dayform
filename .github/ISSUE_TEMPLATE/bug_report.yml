name: Bug report
description: Report a reproducible DAYFORM issue
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version / commit
      placeholder: e.g. v1.0.0 or commit SHA
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed sensitive task data, passwords and private files.
          required: true
