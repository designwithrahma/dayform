name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Run unit and Robolectric tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests com.example.DayformUnitTest --tests com.example.DayformRobolectricTest
      - name: Lint debug variant
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Upload debug build for CI review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dayform-debug-ci-not-a-release
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
