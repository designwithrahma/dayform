name: Signed draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to build and create as a draft (e.g. v1.0.0)'
        required: true
        type: string
        default: 'v1.0.0'

concurrency:
  group: dayform-signed-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  signed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out main at the selected commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm tag and Gradle version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Provide an exact version like v1.0.0'
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          grep -Fq "versionName = \"${version}\"" app/build.gradle.kts || { echo 'Release tag does not match app versionName'; exit 1; }
      - name: Ensure release version is not already published or tagged
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; review it rather than replacing assets.'
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Tag already exists. Review its target before continuing.'
            exit 1
          fi
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Load protected signing credentials
        env:
          KEYSTORE_B64: ${{ secrets.DAYFORM_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.DAYFORM_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DAYFORM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DAYFORM_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Missing protected signing secrets'; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/dayform-release.jks"
          chmod 600 "$RUNNER_TEMP/dayform-release.jks"
          echo "DAYFORM_KEYSTORE_PATH=$RUNNER_TEMP/dayform-release.jks" >> "$GITHUB_ENV"
      - name: Compile and run core tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests com.example.DayformUnitTest --tests com.example.DayformRobolectricTest
          ./gradlew --no-daemon :app:lintDebug
      - name: Build signed release APK
        env:
          DAYFORM_STORE_PASSWORD: ${{ secrets.DAYFORM_STORE_PASSWORD }}
          DAYFORM_KEY_ALIAS: ${{ secrets.DAYFORM_KEY_ALIAS }}
          DAYFORM_KEY_PASSWORD: ${{ secrets.DAYFORM_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Verify signature and prepare checksums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/DAYFORM-${RELEASE_TAG}.apk"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "dist/DAYFORM-${RELEASE_TAG}.apk"
          cd dist && sha256sum "DAYFORM-${RELEASE_TAG}.apk" > SHA256SUMS.txt
      - name: Create draft release for manual device review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo 'Release already exists; review before replacing assets.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" "dist/DAYFORM-${RELEASE_TAG}.apk" dist/SHA256SUMS.txt \
            --draft --target "$GITHUB_SHA" --title "DAYFORM ${RELEASE_TAG}" \
            --notes-file docs/RELEASE_NOTES_TEMPLATE.md
