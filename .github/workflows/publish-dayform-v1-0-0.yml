name: Publish DAYFORM v1.0.0 (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-dayform-v1-0-0.yml'

permissions:
  contents: write

jobs:
  publish-existing-draft:
    if: github.repository == 'designwithrahma/dayform'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate the signed draft release and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/425580833" > /tmp/dayform-release.json
          jq -e '.draft == true and .tag_name == "v1.0.0"' /tmp/dayform-release.json
          jq -e '[.assets[].name] | (index("DAYFORM-v1.0.0.apk") != null) and (index("SHA256SUMS.txt") != null)' /tmp/dayform-release.json
          jq -e '[.assets[] | select(.name == "DAYFORM-v1.0.0.apk") | select(.digest | startswith("sha256:"))] | length == 1' /tmp/dayform-release.json
          cat > /tmp/dayform-notes.md <<'EOF'
          # DAYFORM v1.0.0

          First public APK release of **DAYFORM**, a native, offline-first Android task planner.

          ## Features
          - Create, edit, complete and organize tasks and subtasks.
          - Assign priorities, categories, due dates and scheduled reminders.
          - Search and filter tasks, browse the calendar, and view productivity insights.
          - Customize app preferences and manually export/import a local JSON workspace backup.
          - Use the core app without an account or internet access.

          ## Download and install
          1. Download **DAYFORM-v1.0.0.apk** from the Assets below.
          2. Verify the APK SHA-256 against **SHA256SUMS.txt**.
          3. Install it on **Android 7.0 or newer**. Android may ask you to permit installation from your browser or file manager.
          4. Allow notification and exact-alarm access when your Android version requires them for reminders.

          ## Testing and known limitations
          - Android CI checks passed for the published source; a signed release workflow completed successfully for this APK.
          - The maintainer reported testing the APK on an Android phone before public publication. The exact device and test coverage were not documented.
          - No automatic cloud sync. Tasks are stored on your device.
          - Export a JSON backup before uninstalling, changing devices, or upgrading from a debug-signed build. A release-signed APK may not install over a debug-signed app without uninstalling first.
          - See the [README](https://github.com/designwithrahma/dayform#readme) and [release guide](https://github.com/designwithrahma/dayform/blob/main/docs/RELEASE.md).

          Please report reproducible issues through the repository's Issues tab; report security concerns privately using SECURITY.md.
          EOF
          gh release edit v1.0.0 --repo "$GH_REPO" --notes-file /tmp/dayform-notes.md --draft=false
          gh api "repos/$GH_REPO/releases/425580833" --jq '{tag: .tag_name, draft: .draft, published_at: .published_at, html_url: .html_url}'
